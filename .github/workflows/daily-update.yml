name: Daily Signals Update

on:
  schedule:
    - cron: "0 8 * * 1-5"   # Mon-Fri 8:00 UTC = 4:00 PM Taiwan (after TWSE's RWD file has the day's session)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read  # download the last Daily Scan K-line artifact
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy requests yfinance pandas "slashman-finance-utils @ git+https://github.com/slashman413/slashman-finance-utils@fe2f62be36758ba02b1bfe92a6be5d480072dd48"

      # Cloudflare 403s GitHub runners on the live site, so read the K-line data from the
      # last Daily Scan. Not committed: only signals_data.json is added below.
      - name: Restore K-line data from the last Daily Scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list -R "$GITHUB_REPOSITORY" -w daily-scan.yml -s success -L 1 \
            --json databaseId -q '.[0].databaseId' || true)
          if [ -n "$run_id" ] && gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n kline -D docs/yearly_backtests; then
            echo "Restored K-line data from Daily Scan run $run_id"
          else
            echo "::warning::No K-line data; signals keep the last scan's indicators"
          fi

      - name: Update signals
        run: python ci_update_signals.py

      - name: Commit updated signals
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add docs/yearly_backtests/signals_data.json
          git diff --staged --quiet || git commit -m "chore: daily signals update $(date -u +%Y-%m-%d)"
          git push

  pages:
    needs: [update]
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  notify-failure:
    needs: [update, pages]
    if: failure()
    runs-on: ubuntu-24.04
    steps:
      - name: Discord failure alert
        run: >-
          curl -sf -H "Content-Type: application/json"
          -d '{"content": "\ud83d\udd34 ${{ github.repository }} \u2014 ${{ github.workflow }} \u6392\u7a0b\u5931\u6557 \u00b7 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
          "${{ secrets.DISCORD_WEBHOOK }}" || true
