name: Daily Scan

on:
  schedule:
    # Mon-Fri 14:00 UTC = 22:00 TW (after market close)
    - cron: '0 14 * * 1-5'
  workflow_dispatch:  # manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas numpy

      - name: Run daily scan
        run: python code/ci_scan.py

      - name: Commit and push results
        run: |
          git config user.name "hermes-agent-deepseek-v4-flash"
          git config user.email "hermes-agent@nousresearch.com"
          git add docs/yearly_backtests/signals_data.json docs/yearly_backtests/kline_data.json docs/yearly_backtests/live_kline.json docs/latest_scan.html
          git diff --cached --quiet || \
            git commit -m "auto: daily scan update $(date +'%Y-%m-%d')

          author: hermes-agent-deepseek-v4-flash"
          git push

  notify-failure:
    needs: [scan]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Discord failure alert
        run: >-
          curl -sf -H "Content-Type: application/json"
          -d '{"content": "\ud83d\udd34 ${{ github.repository }} \u2014 ${{ github.workflow }} \u6392\u7a0b\u5931\u6557 \u00b7 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
          "${{ secrets.DISCORD_WEBHOOK }}" || true
