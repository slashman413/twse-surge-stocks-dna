name: Deploy Pages

# The site is docs/ plus the two K-line files, which are rebuilt by the daily
# scan and published here only (never committed, so they don't bloat history).

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      kline_artifact:
        description: "Artifact from the calling run with fresh live_kline.json + kline_data.json ('' = reuse the copies already on Pages)"
        type: string
        default: ''

# CALLERS (workflow_call): daily-scan.yml (job `pages`) and daily-update.yml
# (job `pages`). A called workflow can't exceed its caller's grant: any scope
# added here must also be added to the `pages:` job of EVERY caller, or the
# caller fails with startup_failure (as on 2026-10-12, fixed in 0cf933c).
permissions:
  contents: read
  actions: read  # fallback: download the last Daily Scan K-line artifact
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PAGES_URL: https://slashmantools.us/twse-surge-stocks-dna

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # include the data commit the calling workflow just pushed

      - name: Use fresh K-line data from this run
        if: inputs.kline_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.kline_artifact }}
          path: docs/yearly_backtests

      # Cloudflare (proxied slashmantools.us) 403s curl's default User-Agent, so
      # send a browser one. If Pages is still unreachable, fall back to the
      # newest Daily Scan artifact; if that fails too, deploy without K-line
      # data (the next Daily Scan republishes it) rather than abort the deploy.
      - name: Otherwise reuse the K-line data already on Pages
        if: inputs.kline_artifact == ''
        env:
          GH_TOKEN: ${{ github.token }}
          UA: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
        run: |
          dir=docs/yearly_backtests
          missing=0
          for f in live_kline.json kline_data.json; do
            curl -fsSL --retry 3 --retry-all-errors -H "User-Agent: $UA" \
              -o "$dir/$f" "$PAGES_URL/yearly_backtests/$f" || { rm -f "$dir/$f"; missing=1; }
          done
          if [ "$missing" = 1 ]; then
            echo "::warning::K-line fetch from Pages failed; trying latest Daily Scan artifact"
            run_id=$(gh run list -R "$GITHUB_REPOSITORY" -w daily-scan.yml -s success -L 1 \
              --json databaseId -q '.[0].databaseId' || true)
            if [ -n "$run_id" ] && gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n kline -D "$dir"; then
              echo "Restored K-line data from Daily Scan run $run_id"
            else
              echo "::warning::No K-line data available; deploying without it until the next Daily Scan"
            fi
          fi

      - name: Validate K-line data
        run: |
          python3 -c "
          import json, os
          for f in ('live_kline.json', 'kline_data.json'):
              p = 'docs/yearly_backtests/' + f
              if not os.path.exists(p):
                  print('::warning::' + f + ' missing, skipped')
                  continue
              d = json.load(open(p))
              assert d, f + ' is empty'
              print(f, len(d), 'tickers')
          "

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
